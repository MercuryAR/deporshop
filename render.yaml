services:
  - type: web
    name: deporshop-api
    runtime: docker
    rootDir: back
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/categorias
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: deporshop-frontend
    runtime: static
    rootDir: front
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
