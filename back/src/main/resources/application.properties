# Application
spring.application.name=deporshop-api
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:h2:mem:deporshop
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.deporshop=DEBUG

# JWT
# En producción, seteá JWT_SECRET como variable de entorno con un valor propio
# (no reutilices este default una vez que el repo sea público).
jwt.secret=${JWT_SECRET:q+LjVWuSp+DnlYfOq3v3Yl+s98TlKKEdEz4KfYTEVltHJUIm6MdxDQTD8c27yyQl6goHDmzHDqmAE87aFbWzfA==}
jwt.expiration-ms=86400000

# CORS - lista separada por comas de orígenes permitidos para el frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
